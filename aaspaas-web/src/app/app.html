<div class="app-shell">
  <header class="site-header">
    <a class="brand" routerLink="/home" aria-label="Aaspaas home"><span class="brand-mark">a</span><span>Aaspaas<span class="brand-dot">.</span></span></a>
    <div class="search-box"><span class="search-icon">⌕</span><input aria-label="Search" placeholder="Search for products, shops and services" /><kbd>⌘ K</kbd></div>
    <nav class="header-actions">
      <a class="location-pill" routerLink="/home"><span>⌖</span><span><small>Delivering to</small><b>Your location</b></span></a>
      <a class="icon-link" routerLink="/cart" aria-label="Cart"><span>♧</span><small>Cart</small></a>
      <ng-container *ngIf="isLoggedIn; else guestLinks"><button class="account-button" (click)="logout()">Log out ↗</button></ng-container>
      <ng-template #guestLinks><a class="login-link" routerLink="/auth/login">Log in</a><a class="signup-button" routerLink="/auth/register">Get started <span>→</span></a></ng-template>
    </nav>
  </header>
  <main><router-outlet /></main>
  <footer class="site-footer"><a class="brand footer-brand" routerLink="/home"><span class="brand-mark">a</span><span>Aaspaas<span class="brand-dot">.</span></span></a><span>Your neighbourhood, all in one place.</span><span>© 2026 Aaspaas</span></footer>
</div>
